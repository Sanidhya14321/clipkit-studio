name: Asset contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  asset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:check --check
      - run: pnpm typecheck
      - run: pnpm test
