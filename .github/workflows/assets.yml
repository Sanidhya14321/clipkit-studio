name: Asset contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  asset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build pinned component registry
        run: pnpm exec tsx -e 'import {buildComponents} from "./packages/assets/src/components-build.ts"; buildComponents().catch(e=>{console.error(e);process.exit(1)})'
      - run: pnpm assets:check --check
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=2
