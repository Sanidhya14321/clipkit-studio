name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fast:
    name: fast suite (fmt, clippy, tests, hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      # `just check` includes the studio typecheck and prettier check.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: just check

  fixtures:
    name: fixtures generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - run: fixtures/generate.sh
      - run: jq -e '.version == 1 and (.scenes.changesAtSec | length) == 4' fixtures/generated/ground-truth.json
