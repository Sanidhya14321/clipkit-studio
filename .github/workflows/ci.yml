name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fast:
    name: fast suite (fmt, clippy, tests, hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      # ffmpeg for the media engine; without it and the fixtures, media tests skip.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq ffmpeg
      - run: just fixtures
      # `just check` includes the studio typecheck and prettier check.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: just check

  e2e:
    name: studio e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Record-along processes takes with ffmpeg; the footage tests need the fixtures.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq ffmpeg
      - run: just fixtures
      - run: pnpm --dir studio install --frozen-lockfile
      - run: pnpm --dir studio exec playwright install --with-deps chromium
      # The storyboard test renders through the worker (Remotion downloads its own Chrome).
      - run: just worker
      - run: just e2e

  scripts:
    name: install and package scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh && bash -n scripts/package.sh
      - run: shellcheck install.sh scripts/package.sh

  fixtures:
    name: fixtures generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - run: fixtures/generate.sh
      - run: jq -e '.version == 1 and (.scenes.changesAtSec | length) == 4' fixtures/generated/ground-truth.json
