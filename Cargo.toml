[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Dependencies are added in the phase that first needs them, with versions checked
# against crates.io at that time and recorded in DECISIONS.md.
[workspace.dependencies]
ck-core = { path = "crates/ck-core" }
ck-assets = { path = "crates/ck-assets" }
ck-media = { path = "crates/ck-media" }
ck-voice = { path = "crates/ck-voice" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
json-patch = { version = "4.2.0", features = ["schemars"] }
schemars = "1.2.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
# Asset search (in-memory index over catalog.jsonl). 0.27.0 is under two weeks old (2026-10-30).
tantivy = { version = "=0.26.2", default-features = false }
# Static TS/TSX parsing for asset ingestion (never executes code). All four move together.
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"
# Already in the tree through rust-embed-utils; content hashes for imported media.
sha2 = "0.11.1"
# Pinned below 1.54.1 (2026-10-21, under two weeks old at Phase 2 close).
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
getrandom = "0.4.3"
tower = { version = "0.5.3", features = ["util"] }
# Same major as axum's ws feature, so the test client adds no second tungstenite.
tokio-tungstenite = "0.29.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ck-server = { path = "crates/ck-server" }
clap = { version = "4.6.7", features = ["derive"] }
# Loopback-only client: no TLS, no gzip.
# Pinned below 3.5.0 (2026-10-21, under two weeks old at Phase 2 close).
ureq = { version = "=3.4.2", default-features = false }
ck-mcp = { path = "crates/ck-mcp" }
# TS bindings for the studio; serde attributes are honoured (serde-compat is default).
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
# MCP server over stdio only; no HTTP transports, no auth.
# Pinned below 3.6.0 to 3.8.0 (all under two weeks old at Phase 2 close).
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
# Built studio (studio/dist) inside the binary; content types are mapped by hand, no mime_guess.
rust-embed = { version = "8.13.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.dev.package."*"]
debug = false
