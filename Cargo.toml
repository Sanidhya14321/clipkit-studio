[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Dependencies are added in the phase that first needs them, with versions checked
# against crates.io at that time and recorded in DECISIONS.md.
[workspace.dependencies]
ck-core = { path = "crates/ck-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
json-patch = { version = "4.2.0", features = ["schemars"] }
schemars = "1.2.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
getrandom = "0.4.3"
tower = { version = "0.5.3", features = ["util"] }
# Same major as axum's ws feature, so the test client adds no second tungstenite.
tokio-tungstenite = "0.29.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ck-server = { path = "crates/ck-server" }
clap = { version = "4.6.7", features = ["derive"] }
# Loopback-only client: no TLS, no gzip.
ureq = { version = "3.5.0", default-features = false }
ck-mcp = { path = "crates/ck-mcp" }
# MCP server over stdio only; no HTTP transports, no auth.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.dev.package."*"]
debug = false
